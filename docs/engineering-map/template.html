<script>
'use strict';
const DATA=JSON.parse(document.getElementById('map-data').textContent);
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=new Map(DATA.nodes.map(n=>[n.id,n]));
const children=id=>DATA.nodes.filter(n=>n.parent===id);
const descendants=id=>{const set=new Set([id]);for(const n of DATA.nodes)if(n.parent&&set.has(n.parent))set.add(n.id);return DATA.nodes.filter(n=>set.has(n.id));};
const allApis=id=>[...new Set(descendants(id).flatMap(n=>n.apis))].map(id=>DATA.apis[id]);

 $('inspector-label').textContent='节点详情';$('detail').innerHTML=`<div class="eyeline"><span class="chip">${n.system} 系统 · ${n.level}级</span><span class="chip">${esc(n.scope)}</span><span class="chip api">${apis.filter(a=>a.kind!=='proposal').length} 合同入口</span></div><h2>${esc(n.title)}</h2><p>${esc(n.purpose)}</p>${n.level===1?`<button class="detail-action" data-expand="${n.id}">展开该系统的功能与合同 →</button>`:''}<section class="section"><h3>应具备的能力</h3><p>${esc(n.expected)}</p><h3>现有落点 / 合同</h3><p>${esc(n.existing)}</p></section><section class="section"><h3>尚缺或待核实 · ${gaps.length} 条</h3>${gaps.length?gaps.map(gapHtml).join(''):'<p class="small">本地图未在此节点单列缺口，不代表完整实现或验证完成；需继续核对任务、代码和路线证据。</p>'}</section>${children(n.id).length?`<section class="section"><h3>下钻功能</h3>${children(n.id).map(c=>`<button class="detail-action" data-jump="${c.id}">${esc(c.title)} →<span>${esc(c.purpose)}</span></button>`).join('')}</section>`:''}<section class="section"><h3>上下游关系</h3>${relations.length?relations.map(e=>`<button class="detail-action" data-relation="${e.id}">${esc(e.title)}<span>${esc(byId.get(e.source).title)} → ${esc(byId.get(e.target).title)}</span></button>`).join(''):'<p class="small">父子层级表示能力分解，不自动意味着网络接口；合同两端还可在下方接口中查看。</p>'}</section><section class="section"><h3>接口 / 协议 · ${apis.length} 项</h3><p class="small">数量按本节点子树的唯一合同ID计算，提案另标；不是上线数量或完成率。</p>${apis.map(apiHtml).join('')}</section>${sourceSection(n)}`;
 $('detail').scrollTop=0;
}
function showEdge(e){const originals=e.originals||[e],apis=[...new Set(originals.flatMap(v=>v.apis))].map(id=>DATA.apis[id]);$('inspector-label').textContent=e.kind==='hierarchy'?'层级关系':'跨系统依赖';$('detail').innerHTML=`<div class="eyeline"><span class="chip ${e.kind==='hierarchy'?'':'proposal'}">${e.kind==='hierarchy'?'实线 · 功能分解':'虚线 · 数据 / 调用依赖'}</span></div><h2>${esc(e.title)}</h2><p>${esc(byId.get(e.source).title)} → ${esc(byId.get(e.target).title)}</p><div class="notice">${esc(e.boundary)}</div>${originals.map(v=>`<button class="detail-action" data-jump="${v.source}">上游：${esc(byId.get(v.source).title)} →</button><button class="detail-action" data-jump="${v.target}">下游：${esc(byId.get(v.target).title)} →</button>`).join('')}<section class="section"><h3>关联接口与回执边界</h3>${apis.length?apis.map(apiHtml).join(''):'<p class="small">这是系统→功能的包含关系，不对应一个待调用HTTP端点。</p>'}</section>${link('requirements.md','需求依据')}${link('roadmap.md','执行证据与适用版本')}`;$('detail').scrollTop=0;}
function selectNode(id,{locate=false,hash=true}={}){const n=byId.get(id);if(!n)return;state.selected=id;state.edge=null;state.edgeInfo=null;state.path=null;$('path-picker').value='';if(locate){state.focus=false;state.related=null;}state.audit=false;$('audit').setAttribute('aria-pressed','false');if(locate){state.scope=n.system;state.depth=3;layout();fitBounds(boundsOf([id]),1);}updateDecorations();showNode(n);openDetail();closeNav();if(hash)history.replaceState(null,'','#node='+encodeURIComponent(id));say('已选择'+n.title);}

function showWelcome(){const check=auditData();$('inspector-label').textContent='查漏补缺工作台';$('detail').innerHTML=`<div class="eyeline"><span class="chip">静态工程资料</span><span class="chip">不调用产品服务</span></div><h2>从系统看到合同，<br>从缺口定位能力。</h2><p>先选左侧系统展开功能，再点节点、端口连线或搜索接口。详情对照目标能力、现有落点、待补合同及依据。</p><div class="notice">公开镜像是职责与本地合同索引，不是当前版本接口/交付声明。仅已有文件与片段提供链接，其余标为本地合同；不补导入未审源码或私有材料。执行状态仍只归本地roadmap，原稿/公开适配另列资料索引与提交说明。</div><button class="detail-action" id="welcome-audit">查看四类缺口提示 →</button><section class="section"><h3>不是一张完成率表</h3><p class="small">合同缺失、实现落点待补、证据待核和产品决定分别标注。源码/测试存在不代表整项功能交付，未知保留为待核实。</p><p class="small">需求映射 ${DATA.requirements.length} 项；未关联 ${check.unmapped.length} 项。这里只检查映射完整性，不证明需求已经满足。</p></section><section class="section"><h3>沿关键路径检查</h3>${DATA.paths.map(p=>`<button class="detail-action" data-path="${p.id}">${esc(p.title)} →</button>`).join('')}</section><section class="section"><h3>怎么操作</h3><p class="small">拖动空白平移，滚轮缩放；点击“适配全图”查看全貌。双击一级节点或点左侧系统展开三级。按 / 查找，方向键移动画布，＋/−缩放，0适配，Esc收起查找或抽屉。</p>${link('engineering-map.md','文字说明与合同索引')}${link('roadmap.md','唯一执行状态入口')}</section>`;}
function showAudit(){state.audit=true;$('audit').setAttribute('aria-pressed','true');const gaps=ownGaps.filter(gapPass),check=auditData(),counts=Object.entries(DATA.gapKinds).map(([k,v])=>`<button class="detail-action" data-gap="${k}">${esc(v)}<span>${ownGaps.filter(g=>g.kind===k).length} 条有依据的盘点提示</span></button>`).join('');$('inspector-label').textContent='查漏补缺';$('detail').innerHTML=`<h2>哪些接缝还需补齐？</h2><p>从完整需求盘点，不只画已有文件。点击提示定位负责功能与合同；“证据待核”是证据范围问题，不是重新签一个执行结论。</p><div class="notice">这是本地资料派生说明，不是全量代码审查或实时状态。路线可能先于地图更新，当前候选和结论始终以实施路线为准。</div>${counts}<section class="section"><h3>结构一致性检查</h3><p class="small">需求无对应功能：${check.unmapped.length} 项<br>合同缺调用方/接收方/回执描述：${check.orphanApis.length} 项<br>未被功能节点引用的合同：${check.unusedApis.length} 项</p><p class="small">零项仅表示这份清单的结构已关联，不证明代码/契约/端到端证据完整。提案没有已冻结方法或路径，必须继续查具体接缝。</p></section><section class="section"><h3>${state.gap==='all'?'全部盘点提示':esc(DATA.gapKinds[state.gap])} · ${gaps.length} 条</h3>${gaps.map(gapHtml).join('')}</section>${link('requirements.md','完整需求')}${link('acceptance.md','验收目标与层级')}${link('roadmap.md','唯一执行状态')}`;openDetail();}
function showPath(id){const p=DATA.paths.find(p=>p.id===id);if(!p)return;state.path=id;state.related=null;state.scope=null;state.depth=1;state.selected=null;state.edge=null;state.focus=false;state.audit=false;$('audit').setAttribute('aria-pressed','false');$('path-picker').value=id;layout();fitBounds(boundsOf([...new Set(p.steps.map(([n])=>n[0]))]),.9);$('inspector-label').textContent='端到端关键路径';const proposed=p.steps.filter(([,a])=>DATA.apis[a]?.kind==='proposal').length;$('detail').innerHTML=`<div class="eyeline"><span class="chip">功能 / 合同链</span>${proposed?`<span class="chip proposal">${proposed} 步涉及提案</span>`:''}</div><h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p>${p.steps.map(([n,a],i)=>{const api=DATA.apis[a];return `<div class="path-step"><span class="num">${i+1}</span><div><button data-jump="${n}">${esc(byId.get(n).system+' · '+byId.get(n).title)} →</button><small>${esc(api.kind==='http'?api.method+' '+api.path:api.title)}</small><span class="chip ${api.kind==='proposal'?'proposal':'api'}">${api.kind==='proposal'?'需落实合同':'源码/协议入口'}</span></div></div>`;}).join('')}<div class="notice">${esc(p.note)}</div><section class="section"><h3>继续核对</h3><p class="small">检查每一步的调用方、接收方、输入输出、回执层级及错误/未知恢复。线能画通不等于运行链路已通；不以结构映射替代授权、幂等、离线或备份后当前性证据。</p></section>${link('acceptance.md','端到端验收目标')}${link('roadmap.md','实际执行与证据范围')}`;openDetail();closeNav();}
function search(term){const q=term.trim().toLowerCase();if(!q){results=[];closeSearch();return;}const found=[];for(const n of DATA.nodes){const direct=n.apis.map(id=>DATA.apis[id]);const text=[n.title,n.purpose,n.id,...n.req,...n.acceptance,...n.code,...direct.flatMap(a=>[a.title,a.method,a.path,a.inputs,a.protocol]),...n.gaps.map(g=>g.note)].join(' ').toLowerCase();if(text.includes(q)){const apiMatch=direct.find(a=>([a.method,a.path,a.title].join(' ').toLowerCase()).includes(q));found.push({n,apiMatch,score:(n.title.toLowerCase().includes(q)?100:0)+(apiMatch?80:0)+n.level});}}found.sort((a,b)=>b.score-a.score);results=found.slice(0,24);resultIndex=-1;const box=$('search-results'),r=$('search').getBoundingClientRect();box.style.left=r.left+'px';box.style.top=r.bottom+6+'px';box.style.width=Math.min(520,innerWidth-r.left-10)+'px';box.innerHTML=results.length?results.map(({n,apiMatch},i)=>`<button class="result-item" role="option" id="result-${i}" data-result="${i}" aria-selected="false"><strong>${esc(n.title)}</strong><span class="small">${esc(n.system+' · '+byId.get(n.system).title+' / '+n.level+'级')}${apiMatch?' · '+esc(apiMatch.method&&apiMatch.kind==='http'?apiMatch.method+' '+apiMatch.path:apiMatch.title):''}</span></button>`).join(''):'<div class="result-empty">未找到匹配项。试试“source/self”、“媒体”、“未知”或“R13”。</div>';box.classList.add('open');$('search').setAttribute('aria-expanded','true');}
function closeSearch(){$('search-results').classList.remove('open');$('search').setAttribute('aria-expanded','false');$('search').removeAttribute('aria-activedescendant');}
function chooseResult(i){const r=results[i];if(!r)return;selectNode(r.n.id,{locate:true});closeSearch();$('search').blur();}
$('system-count').textContent=DATA.systems.length;
$('system-nav').innerHTML=DATA.systems.map(s=>`<button class="nav-item" data-system="${s.id}"><span class="sys-key">${s.id}</span>${esc(s.title)}<span class="nav-count">${children(s.id).length}</span></button>`).join('');
$('inventory').textContent=`${DATA.systems.length} 系统 · ${DATA.nodes.filter(n=>n.level===2).length} 功能 · ${Object.values(DATA.apis).filter(a=>a.kind==='http').length} HTTP合同 · 提案另标`;
for(const p of DATA.paths){const o=document.createElement('option');o.value=p.id;o.textContent=p.title;$('path-picker').append(o);}
$('system-nav').addEventListener('click',e=>{const b=e.target.closest('[data-system]');if(b)expandSystem(b.dataset.system);});$('overview').onclick=overview;
$('nodes').addEventListener('click',e=>{const b=e.target.closest('[data-node]');if(b)selectNode(b.dataset.node);});$('nodes').addEventListener('dblclick',e=>{const b=e.target.closest('[data-node]');if(b)expandSystem(byId.get(b.dataset.node).system);});
$('detail').addEventListener('click',e=>{const j=e.target.closest('[data-jump]'),ex=e.target.closest('[data-expand]'),rel=e.target.closest('[data-relation]'),p=e.target.closest('[data-path]'),g=e.target.closest('[data-gap]');if(j)selectNode(j.dataset.jump,{locate:true});else if(ex)expandSystem(ex.dataset.expand);else if(rel){const original=DATA.edges.find(v=>v.id===rel.dataset.relation);selectEdge({...original,originals:[original]});}else if(p)showPath(p.dataset.path);else if(g){state.gap=g.dataset.gap;$('gap-filter').value=state.gap;updateDecorations();showAudit();}else if(e.target.closest('#welcome-audit'))showAudit();});
$('depth').onchange=()=>{state.depth=+$('depth').value;state.edge=null;layout();if(state.selected)fitBounds(boundsOf([state.selected]),1);else fitBounds(state.bounds,.85);};
$('hierarchy').onchange=$('dependencies').onchange=()=>{state.edge=null;renderEdges();updateDecorations();};
$('gap-filter').onchange=()=>{state.gap=$('gap-filter').value;updateDecorations();showAudit();};$('audit').onclick=()=>{if(state.audit){state.audit=false;$('audit').setAttribute('aria-pressed','false');if(state.selected)showNode(byId.get(state.selected));else showWelcome();}else showAudit();};
$('path-picker').onchange=()=>{$('path-picker').value?showPath($('path-picker').value):overview();};$('focus').onclick=()=>{
 if(state.focus){const previous=state.beforeFocus||{};state.focus=false;state.related=null;state.scope=previous.scope??null;state.depth=previous.depth||1;layout();if(state.selected&&state.positions.has(state.selected))fitBounds(boundsOf([state.selected]),1);else fitBounds(state.bounds);return;}
 const anchor=state.selected||state.edgeInfo?.source;if(!anchor)return;
 const seeds=new Set(descendants(anchor).map(n=>n.id)),related=new Set(seeds);
 for(const e of DATA.edges)if(seeds.has(e.source)||seeds.has(e.target)){related.add(e.source);related.add(e.target);}
 for(const id of [...related]){let n=byId.get(id);while(n?.parent){related.add(n.parent);n=byId.get(n.parent);}}
 state.beforeFocus={scope:state.scope,depth:state.depth};state.focus=true;state.related=related;state.scope=null;state.depth=3;state.path=null;$('path-picker').value='';layout();fitBounds(boundsOf([...related]),.95);say('已聚焦选中项的直接关系与层级上下文');
};
$('fit').onclick=()=>fitBounds(state.bounds);$('zoom-in').onclick=()=>setZoom(state.camera.k*1.2);$('zoom-out').onclick=()=>setZoom(state.camera.k/1.2);$('reset-zoom').onclick=()=>setZoom(1);
$('nav-toggle').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('nav-toggle').setAttribute('aria-expanded',open);};$('nav-shade').onclick=closeNav;$('detail-toggle').onclick=openDetail;$('close-detail').onclick=()=>{$('inspector').classList.remove('open');$('canvas').focus({preventScroll:true});};
$('search').oninput=()=>search($('search').value);$('search').onfocus=()=>{if($('search').value)search($('search').value);};$('search').onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!results.length)return;resultIndex=(resultIndex+(e.key==='ArrowDown'?1:-1)+results.length)%results.length;document.querySelectorAll('[data-result]').forEach((el,i)=>{el.classList.toggle('current',i===resultIndex);el.setAttribute('aria-selected',i===resultIndex);});$('search').setAttribute('aria-activedescendant','result-'+resultIndex);$('result-'+resultIndex).scrollIntoView({block:'nearest'});}else if(e.key==='Enter'&&results.length){e.preventDefault();chooseResult(Math.max(0,resultIndex));}else if(e.key==='Escape'){e.stopPropagation();closeSearch();}};
$('search-results').onclick=e=>{const b=e.target.closest('[data-result]');if(b)chooseResult(+b.dataset.result);};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#search-results,.search-wrap'))closeSearch();});
const canvas=$('canvas');canvas.addEventListener('wheel',e=>{if(e.target.closest('.canvas-footer'))return;e.preventDefault();const r=canvas.getBoundingClientRect();setZoom(state.camera.k*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
const pointers=new Map();let pinch=null;
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button,.edge-hit,.edge-label,.minimap,.canvas-footer'))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(pointers.size===1){drag={id:e.pointerId,x:e.clientX,y:e.clientY,cx:state.camera.x,cy:state.camera.y};canvas.classList.add('dragging');}else if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),scale:state.camera.k};drag=null;}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinch){const[a,b]=[...pointers.values()],r=canvas.getBoundingClientRect();setZoom(pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/pinch.distance,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);}else if(drag?.id===e.pointerId){state.camera.x=drag.cx+e.clientX-drag.x;state.camera.y=drag.cy+e.clientY-drag.y;applyCamera();}});
function stopPointer(e){pointers.delete(e.pointerId);pinch=null;drag=null;canvas.classList.remove('dragging');if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}canvas.addEventListener('pointerup',stopPointer);canvas.addEventListener('pointercancel',stopPointer);
canvas.addEventListener('keydown',e=>{if(e.target!==canvas)return;const c=state.camera;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();c.x+=e.key==='ArrowLeft'?60:e.key==='ArrowRight'?-60:0;c.y+=e.key==='ArrowUp'?60:e.key==='ArrowDown'?-60:0;applyCamera();}});
$('minimap').onclick=e=>{const r=$('minimap').getBoundingClientRect(),sx=r.width/state.bounds.w,sy=r.height/state.bounds.h,scale=Math.min(sx,sy),ox=(r.width-state.bounds.w*scale)/2,oy=(r.height-state.bounds.h*scale)/2;state.camera.x=canvas.clientWidth/2-(e.clientX-r.left-ox)/scale*state.camera.k;state.camera.y=canvas.clientHeight/2-(e.clientY-r.top-oy)/scale*state.camera.k;applyCamera();};
document.addEventListener('keydown',e=>{const editing=e.target.closest('input,select,textarea');if((e.key==='/'&&!editing)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();$('search').focus();}else if(e.key==='Escape'){closeSearch();closeNav();if(innerWidth<1200)$('inspector').classList.remove('open');if(state.focus)$('focus').click();}else if(!editing&&!e.ctrlKey&&!e.metaKey){if(e.key==='+'||e.key==='='){e.preventDefault();setZoom(state.camera.k*1.2);}if(e.key==='-'){e.preventDefault();setZoom(state.camera.k/1.2);}if(e.key==='0'){e.preventDefault();fitBounds(state.bounds);}}});
window.addEventListener('resize',()=>{closeSearch();clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const selected=state.selected;layout();if(selected)fitBounds(boundsOf([selected]),1);else if(state.depth===1)initialCamera();else fitBounds(state.bounds);},120);});

layout();initialCamera();showWelcome();const initial=new URLSearchParams(location.hash.slice(1)).get('node');if(byId.has(initial))selectNode(initial,{locate:true,hash:false});
window.EngineeringMap=Object.freeze({inventory:()=>({systems:DATA.systems.length,functions:DATA.nodes.filter(n=>n.level===2).length,nodes:DATA.nodes.length,http:Object.values(DATA.apis).filter(a=>a.kind==='http').length,protocols:Object.values(DATA.apis).filter(a=>a.kind==='protocol').length,proposals:Object.values(DATA.apis).filter(a=>a.kind==='proposal').length,gaps:ownGaps.length,...auditData()}),view:()=>({scope:state.scope,depth:state.depth,selected:state.selected,edge:state.edge,focus:state.focus,gap:state.gap,path:state.path,camera:{...state.camera},visible:state.positions.size})});
</script>

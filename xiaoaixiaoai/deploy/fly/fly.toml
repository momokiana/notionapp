# Fly.io template for a new deployment; review docs/deploy/README.md before use.
#   fly launch --config deploy/fly/fly.toml --copy-config --no-deploy --ha=false
#   fly volumes create xiaoaixiaoai_data --size 1 --config deploy/fly/fly.toml
#   fly secrets set POCKET_PUBLIC_URL=https://<your app>.fly.dev --config deploy/fly/fly.toml
#   fly deploy --config deploy/fly/fly.toml
# Keep exactly one machine: devices, agents and pending calls live in that one process.
app = "xiaoaixiaoai-relay-example"
primary_region = "nrt"

[build]
  # Replace with your own reviewed, already published image. No upstream default.
  image = "registry.example.com/your-team/xiaoaixiaoai-relay:VERSION"

[env]
  POCKET_TRUST_PROXY = "1"

[mounts]
  source = "xiaoaixiaoai_data"
  destination = "/data"

[http_service]
  internal_port = 7420
  force_https = true
  # Computers hold a WebSocket open all the time; never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.notifier.xiaoaixiaoai.bridge'
version = '0.1.0'

android {
  namespace "dev.notifier.xiaoaixiaoai.bridge"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // Same client React Native ships; resolved to its version.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}

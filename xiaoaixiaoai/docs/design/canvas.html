<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Herdr Pocket · 设计画布</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #4a3b5c; --muted: #6e6280; --faint: #8e849c; --ghost: #b3aabd; --line: #f1e4ec;
    --s0: #ffffff; --s1: #fff9fb; --s2: #fbf3f8; --s3: #f5ecf3;
    --accent: #ff7ea8; --accent-c: #ffe3ec;
    --work: #1e9a7c; --work-c: #ddf5ee; --block: #e2556a; --block-c: #ffe6e9;
    --done: #7a5fd6; --done-c: #eee8ff; --idle: #7d7390; --idle-c: #f2eff5;
    --kl: "ZCOOL KuaiLe", "Nunito", system-ui, sans-serif;
    --ui: "Nunito", system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: "JetBrains Mono", "Maple Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--ui); color: var(--ink); }
  body {
    background-color: #e9edf5;
    background-image: radial-gradient(#c9d0de 1.2px, transparent 1.2px);
    background-size: 24px 24px;
  }
  #viewport { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #wires path { fill: none; transition: opacity .15s, stroke-width .15s; }
  #wires path.why { stroke-width: 2.2; opacity: .55; }
  #wires path.nav { stroke: var(--accent); stroke-width: 3.2; stroke-dasharray: 10 7; opacity: .75; }
  #wires path.arch { stroke: #7d8699; stroke-width: 3; opacity: .9; }
  #wires path.hl { stroke-width: 4.5; opacity: 1; }
  #wires text { font: 700 15px var(--ui); fill: #4f5562; paint-order: stroke; stroke: #e9edf5; stroke-width: 6px; }
  body.only-why #wires .nav, body.only-nav #wires .why { opacity: 0; }

  /* ---------- nodes (ComfyUI-like) ---------- */
  .node {
    position: absolute; background: #fff; border-radius: 14px; border: 1.5px solid #cfd6e4;
    box-shadow: 0 6px 24px rgba(40, 55, 90, .10); min-width: 200px;
  }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(75,103,180,.25), 0 6px 24px rgba(40,55,90,.12); }
  .nh {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid #e3e7ef;
    border-radius: 13px 13px 0 0; background: #f4f6fb; cursor: move; user-select: none; font-weight: 800; font-size: 15px;
  }
  .nh .kind { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .04em; }
  .nh .num {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #fff; flex: none;
  }
  .nb { padding: 12px 14px 14px; font-size: 14px; line-height: 1.6; }
  .node.screen { background: #f7f9fd; }
  .node.screen .nh { background: linear-gradient(90deg, #dee8ff, #f4f6fb); font-family: var(--kl); font-weight: 400; font-size: 19px; }
  .node.screen .nb { padding: 14px; }
  .node.why { width: 330px; }
  .node.why .nb p { margin: 0 0 8px; }
  .node.why .alt { color: var(--muted); font-size: 13px; background: #f6f7fb; border-radius: 8px; padding: 6px 9px; margin-top: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .tag { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; color: #fff; }
  .src { font-size: 12px; color: var(--faint); border-top: 1px dashed #dde2ec; margin-top: 8px; padding-top: 7px; }
  .node.arch { width: 300px; }
  .node.arch .nh { background: #eef1f9; font-size: 16px; }
  .node.note .nh { background: #fff5e8; }
  .node.hl-node { border-color: #f0a35c; box-shadow: 0 0 0 4px rgba(240,163,92,.3); }

  /* ---------- toolbar ---------- */
  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
    background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border: 1px solid #d6dce8; border-radius: 99px;
    padding: 6px; box-shadow: 0 8px 30px rgba(40,55,90,.18); z-index: 10; flex-wrap: wrap; max-width: 96vw; justify-content: center;
  }
  #bar button {
    font: 700 13px var(--ui); border: 0; background: transparent; padding: 8px 13px; border-radius: 99px; cursor: pointer; color: var(--ink);
  }
  #bar button:hover { background: #eef1f9; }
  #bar button.on { background: var(--accent-c); color: var(--accent); }
  #bar .sep { width: 1px; height: 22px; background: #dce0e8; margin: 0 2px; }
  #zoom { font: 700 12px var(--mono); color: var(--faint); min-width: 48px; text-align: center; }
  #title {
    position: fixed; left: 18px; top: 14px; z-index: 10; font-family: var(--kl); font-size: 24px; color: var(--ink);
    background: rgba(255,255,255,.85); padding: 6px 16px; border-radius: 99px; border: 1px solid #d6dce8;
  }

  /* ---------- phone (Android, 360 x 760 dp) ---------- */
  .phone {
    width: 360px; height: 760px; border-radius: 34px; border: 9px solid #1d212b; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #fff6f9 0%, #f7f2ff 80%); font-family: var(--ui); color: var(--ink);
    display: flex; flex-direction: column; font-size: 14px;
  }
  .phone .sb { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 12px; font-weight: 700; }
  .phone .gest { height: 18px; flex: none; display: grid; place-items: center; }
  .phone .gest::after { content: ""; width: 110px; height: 4px; border-radius: 4px; background: #1e232e; opacity: .55; }
  .kl { font-family: var(--kl); }
  .appbar { height: 56px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px; }
  .appbar .t { flex: 1; min-width: 0; }
  .appbar .t b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .t span { display: block; font-size: 12px; color: var(--faint); }
  .ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; flex: none; color: var(--muted); }
  .scroll { flex: 1; overflow: hidden; padding: 0 14px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--s0); border-radius: 14px; border: 1px solid #e6eaf2; padding: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .st-working { color: var(--work); background: var(--work-c); }
  .st-blocked { color: var(--block); background: var(--block-c); }
  .st-done { color: var(--done); background: var(--done-c); }
  .st-idle { color: var(--idle); background: var(--idle-c); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .breath { animation: breath 2.4s ease-in-out infinite; }
  @keyframes breath { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .chips { display: flex; gap: 6px; overflow: hidden; }
  .chip { flex: none; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 10px; border: 1px solid #cfd6e4; background: var(--s0); color: var(--muted); }
  .chip.on { background: var(--accent-c); border-color: transparent; color: var(--accent); }
  .grp { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--muted); margin-top: 2px; }
  .grp .on { color: var(--work); }
  .grp .off { color: var(--ghost); }
  .row { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; background: var(--s0); border: 1px solid #e9ecf3; }
  .row.need { border-color: #f3c6b0; background: #fffaf7; }
  .av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
  .av.c { background: #ffe1cf; color: #b9572f; } .av.o { background: #dcefff; color: #3b6fb0; } .av.x { background: #e3f6e9; color: #2f8a52; }
  .row .m { flex: 1; min-width: 0; }
  .row .m b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .m span { display: block; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; color: var(--ghost); }
  .navbar { height: 72px; flex: none; display: flex; background: #f0f3fa; border-top: 1px solid #e3e7ef; }
  .navbar div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
  .navbar i { font-style: normal; width: 56px; height: 30px; border-radius: 99px; display: grid; place-items: center; font-size: 17px; }
  .navbar .on i { background: var(--accent-c); }
  .navbar .on { color: var(--ink); }
  .badge { position: absolute; top: 9px; left: calc(50% + 8px); background: var(--block); color: #fff; font-size: 10px; font-weight: 800; border-radius: 99px; padding: 0 5px; line-height: 16px; }
  .btn { height: 52px; border-radius: 99px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .btn.fill { background: var(--accent); color: #fff; }
  .btn.tonal { background: var(--accent-c); color: var(--accent); }
  .btn.text { color: var(--accent); height: 44px; }
  .field { border: 1.5px solid #b9c2d4; border-radius: 10px; padding: 14px 12px 10px; position: relative; background: var(--s0); font-size: 15px; color: var(--ghost); }
  .field label { position: absolute; top: -9px; left: 10px; background: #eef3fd; padding: 0 4px; font-size: 12px; color: var(--accent); font-weight: 700; }
  .seg { display: flex; background: var(--s2); border-radius: 99px; padding: 3px; margin: 0 14px 8px; flex: none; }
  .seg div { flex: 1; text-align: center; padding: 7px 0; border-radius: 99px; font-weight: 800; font-size: 13px; color: var(--muted); }
  .seg .on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(30,35,46,.12); }
  .bub { max-width: 82%; padding: 9px 12px; border-radius: 18px; font-size: 13.5px; line-height: 1.5; }
  .bub.me { align-self: flex-end; background: #ffe3ec; border-bottom-right-radius: 6px; }
  .bub.ai { align-self: flex-start; background: var(--s0); border: 1px solid #e6eaf2; border-bottom-left-radius: 6px; }
  .think { align-self: flex-start; font-size: 12px; font-weight: 700; color: #6b578f; background: #ece5fb; padding: 4px 10px; border-radius: 99px; }
  .tool { align-self: stretch; border: 1px solid #e1e6ef; border-radius: 12px; background: var(--s0); font-size: 12.5px; overflow: hidden; }
  .tool .h { display: flex; gap: 6px; align-items: center; padding: 7px 10px; font-weight: 800; }
  .tool .h span { color: var(--faint); font-weight: 600; font-family: var(--mono); font-size: 11.5px; }
  .tool .h em { margin-left: auto; font-style: normal; color: var(--ghost); }
  .tool pre { margin: 0; padding: 6px 10px 8px; font: 11px/1.5 var(--mono); color: var(--muted); background: #f3f5fa; border-top: 1px solid #e8ecf3; }
  .tool.err { border-color: #f0c2bf; } .tool.err .h { color: #a54743; }
  .ask { margin: 0 10px 6px; background: var(--block-c); border-radius: 18px; padding: 10px 12px; flex: none; }
  .ask p { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #7a3a1f; }
  .ask .bs { display: flex; gap: 8px; }
  .ask .bs div { flex: 1; height: 44px; border-radius: 99px; display: grid; place-items: center; font-weight: 800; }
  .ask .y { background: var(--block); color: #fff; } .ask .n { background: #fff; color: var(--block); } .ask .v { background: transparent; color: #7a3a1f; flex: .7 !important; }
  .keys { display: flex; gap: 6px; padding: 0 10px 6px; flex: none; overflow: hidden; }
  .key { flex: none; font: 700 12.5px var(--mono); padding: 0 12px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--s0); border: 1px solid #d5dbe7; color: var(--muted); }
  .key.danger { border: 1.5px solid #e2a19e; color: #a54743; margin-left: auto; }
  .composer { margin: 0 10px 6px; display: flex; gap: 8px; align-items: center; background: rgba(251,252,255,.97); border-radius: 28px; padding: 6px 6px 6px 16px; border: 1px solid #dde3ee; box-shadow: 0 4px 16px rgba(60,80,130,.10); flex: none; }
  .composer .in { flex: 1; color: var(--ghost); font-size: 14px; }
  .send { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 19px; font-weight: 800; }
  .term { flex: 1; margin: 0 10px 8px; background: #1c1f28; color: #d6dbe6; border-radius: 14px; padding: 10px 11px; font: 11px/1.55 var(--mono); overflow: hidden; position: relative; white-space: pre; }
  .term .g { color: #8fd3a8; } .term .y { color: #f0c674; } .term .d { color: #7d8597; }
  .tbar { display: flex; align-items: center; gap: 8px; margin: 0 14px 8px; font-size: 12px; color: var(--faint); font-weight: 700; flex: none; }
  .jump { position: absolute; right: 10px; bottom: 10px; background: #fff; color: var(--ink); font: 800 12px var(--ui); padding: 7px 12px; border-radius: 99px; box-shadow: 0 3px 10px rgba(0,0,0,.35); white-space: normal; }
  .fab { position: absolute; right: 16px; bottom: 98px; height: 56px; padding: 0 20px; border-radius: 16px; background: var(--accent-c); color: var(--accent); display: flex; align-items: center; gap: 8px; font-weight: 800; box-shadow: 0 4px 14px rgba(60,80,130,.22); }
  .scrim { position: absolute; inset: 0; background: rgba(20,24,32,.42); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fbfcff; border-radius: 28px 28px 0 0; padding: 8px 18px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .handle { width: 36px; height: 4px; border-radius: 4px; background: #c5cbd7; margin: 4px 0 2px; }
  .code { font-family: var(--kl); font-size: 40px; letter-spacing: .06em; color: var(--ink); }
  .code span { color: var(--accent); }
  .qr { width: 150px; height: 150px; border-radius: 14px; background:
      conic-gradient(from 90deg at 2px 2px, transparent 25%, #1e232e 0) 0 0/15px 15px; border: 8px solid #fff; outline: 1px solid #e3e7ef; opacity: .85; }
  .bar { width: 100%; height: 6px; border-radius: 6px; background: #e3e7ef; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 72%; background: var(--accent); border-radius: 6px; }
  .set { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid #eceff5; }
  .set:last-child { border-bottom: 0; }
  .set b { flex: 1; font-size: 14px; } .set span { font-size: 13px; color: var(--faint); }
  .sw { width: 44px; height: 26px; border-radius: 99px; background: var(--accent); position: relative; }
  .sw::after { content: ""; position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .sw.off { background: #c7cdd8; } .sw.off::after { right: auto; left: 3px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; display: inline-block; margin-left: 4px; border: 3px solid #fff; outline: 1px solid #dce0e8; }
  .swatch.on { outline: 2.5px solid var(--ink); }
  .h2 { font-size: 12px; font-weight: 800; color: var(--faint); margin: 4px 4px -4px; letter-spacing: .06em; }

  /* anchors + badges */
  [data-a] { position: relative; }
  [data-a].hl { outline: 3px solid #f0a35c; outline-offset: 2px; border-radius: 12px; }
  .bdg {
    position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%; color: #fff; font: 800 12px/22px var(--ui);
    text-align: center; z-index: 3; box-shadow: 0 0 0 2px #fff; pointer-events: none;
  }
  /* thumb zone overlay (Hoober-style map for one-handed use) */
  .thumb { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 4; mix-blend-mode: multiply; }
  body.thumb-r .thumb, body.thumb-l .thumb { display: block; }
  body.thumb-r .thumb { background: radial-gradient(circle at 92% 104%, rgba(46,170,120,.42) 0 46%, rgba(240,190,60,.36) 46% 72%, rgba(225,90,80,.34) 72%); }
  body.thumb-l .thumb { background: radial-gradient(circle at 8% 104%, rgba(46,170,120,.42) 0 46%, rgba(240,190,60,.36) 46% 72%, rgba(225,90,80,.34) 72%); }
  .legend-z { display: flex; gap: 10px; font-size: 13px; margin-top: 6px; }
  .legend-z i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
  table.tk { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.tk td { padding: 5px 4px; border-bottom: 1px solid #eef0f5; vertical-align: middle; }
  .sq { display: inline-block; width: 18px; height: 18px; border-radius: 5px; vertical-align: -4px; margin-right: 4px; border: 1px solid rgba(0,0,0,.08); }
</style>
</head>
<body class="thumb-off">
<div id="title"><img src="../brand/logo.svg" style="width:30px;height:30px;border-radius:8px;vertical-align:-6px;margin-right:6px">Herdr Pocket · 设计画布</div>
<div id="viewport"><div id="world"><svg id="wires"></svg></div></div>
<div id="bar">
  <button data-act="fit">适应全部</button>
  <span id="zoom">100%</span>
  <span class="sep"></span>
  <button data-go="g-arch">架构</button>
  <button data-go="s1">首次连接</button>
  <button data-go="s2">总览</button>
  <button data-go="s3">对话</button>
  <button data-go="s4">终端</button>
  <button data-go="s5">设备</button>
  <button data-go="s6">配对</button>
  <button data-go="s7">设置</button>
  <span class="sep"></span>
  <button data-thumb="r" title="快捷键 H">拇指热区：关</button>
  <button data-wires="all">连线：全部</button>
</div>

<script>
/* =====================================================================
   Principles. Every rationale card cites one or more of these.
   "judge" marks a product decision with no direct research behind it.
   ===================================================================== */
const P = {
  thumb:   { t: "拇指热区",   c: "#2e9c78", src: "Steven Hoober, “How Do Users Really Hold Mobile Devices?”（UXmatters, 2013）：约 49% 的人单手握持，拇指最容易够到屏幕中下部，顶部和远侧角落最难够到。" },
  fitts:   { t: "费茨定律",   c: "#3b7fc4", src: "Fitts（1954）：目标越大、离手指越近，点得越快越准。" },
  hick:    { t: "希克定律",   c: "#7a5cc2", src: "Hick（1952）/ Hyman（1953）：可选项越多，做决定越慢。" },
  load:    { t: "渐进披露",   c: "#8a6d3b", src: "Nielsen Norman Group「Progressive Disclosure」：先给最常用的，细节按需展开，降低认知负荷。" },
  status:  { t: "状态可见",   c: "#2b8fa3", src: "Nielsen 十大可用性原则 #1：系统状态可见，及时反馈。" },
  prevent: { t: "防误触",     c: "#c4513c", src: "Nielsen #5 防错：破坏性、不可撤销的操作要提高触发成本或二次确认。" },
  control: { t: "用户掌控",   c: "#4b67b4", src: "Nielsen #3 用户控制与自由：随时能退出、能回到原处，不被系统强行带走。" },
  recog:   { t: "识别优于回忆", c: "#5a7d2a", src: "Nielsen #6：让用户看见选项，而不是记住它。" },
  platform:{ t: "安卓规范",   c: "#3f6f5f", src: "Material Design 3：触控目标 ≥ 48dp、底部导航栏 3–5 项、FAB、底部弹窗、对话框按钮用动词；Android 系统返回手势。" },
  a11y:    { t: "无障碍",     c: "#6b6f7c", src: "WCAG 2.2：1.4.1 不只靠颜色传达信息；1.4.3 文字对比度 ≥ 4.5:1；1.4.4 文字可放大。" },
  emotion: { t: "情绪设计",   c: "#d0607e", src: "Don Norman《Emotional Design》（2004）：外观带来的愉悦感会提高人对可用性的感受和对小问题的容忍。" },
  chunk:   { t: "组块记忆",   c: "#9a6a18", src: "Miller（1956）：把信息切成小块更容易记住和转述。" },

/* =====================================================================
   Canvas engine
   ===================================================================== */
const vp = document.getElementById("viewport");
const world = document.getElementById("world");
const svg = document.getElementById("wires");
const view = { x: 60, y: 60, s: 0.5 };
const nodes = new Map(); // id -> { el, x, y, group }
const wires = []; // { a: () => [x,y], b: () => [x,y], cls, color, label, card }

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  document.getElementById("zoom").textContent = `${Math.round(view.s * 100)}%`;
}

function addNode({ id, title, kind = "", x, y, w, html, cls = "", group }) {
  const el = document.createElement("div");
  el.className = `node ${cls}`;
  el.dataset.id = id;
  if (w) el.style.width = `${w}px`;
  el.innerHTML = `<div class="nh">${title}<span class="kind">${kind}</span></div><div class="nb">${html}</div>`;
  world.appendChild(el);
  const n = { el, x, y, group: group ?? id };
  nodes.set(id, n);
  place(n);
  return n;
}
function place(n) { n.el.style.left = `${n.x}px`; n.el.style.top = `${n.y}px`; }

/** Element position in world coordinates. */
function rectOf(el) {
  const r = el.getBoundingClientRect();
  const w = world.getBoundingClientRect();
  return { x: (r.left - w.left) / view.s, y: (r.top - w.top) / view.s, w: r.width / view.s, h: r.height / view.s };
}

function build() {
  for (const n of INFO) addNode({ ...n, kind: "说明" });
  for (const a of ARCH) addNode({ ...a, kind: "架构", cls: `arch ${a.cls ?? ""}`, group: "g-arch" });
  for (const s of SCREENS) {
    const n = addNode({ id: s.id, title: s.title, kind: "安卓 · 360×760dp", x: s.x, y: s.y, html: `<div class="phone">${s.html}<div class="thumb"></div></div>`, cls: "screen" });
    n.screen = true;
  }
  // rationale cards, numbered per screen
  const count = {};
  for (const [sid, anchor, tags, title, why, alt] of WHY) {
    const num = (count[sid] = (count[sid] ?? 0) + 1);
    const color = P[tags[0]].c;
    const target = nodes.get(sid).el.querySelector(`[data-a="${anchor}"]`);
    if (!target) { console.warn("missing anchor", sid, anchor); continue; }
    const b = document.createElement("span");
    b.className = "bdg"; b.style.background = color; b.textContent = num;
    target.appendChild(b);
    const id = `${sid}-${anchor}`;
    const tagHtml = tags.map((t) => `<span class="tag" style="background:${P[t].c}">${P[t].t}</span>`).join("");
    const card = addNode({
      id, kind: "依据", x: 0, y: 0, cls: "why", group: sid,
      title: `<span class="num" style="background:${color}">${num}</span>${title}`,
      html: `<div class="tags">${tagHtml}</div><p>${why}</p>${alt ? `<div class="alt">没选的方案：${alt}</div>` : ""}<div class="src">${tags.map((t) => P[t].src).join("<br/>")}</div>`,
    });
    card.anchor = target;
    card.sid = sid;
    wires.push({ cls: "why", color, card: id, target,
      a: () => { const r = rectOf(target); return [r.x + r.w, r.y + r.h / 2]; },
      b: () => { const n = nodes.get(id); return [n.x, n.y + 22]; } });
    card.el.addEventListener("mouseenter", () => highlight(id, true));
    card.el.addEventListener("mouseleave", () => highlight(id, false));
  }
  for (const [from, anchor, to, label] of NAV_EDGES) {
    const target = nodes.get(from).el.querySelector(`[data-a="${anchor}"]`);
    wires.push({ cls: "nav", label,
      a: () => { const r = rectOf(target); return [r.x + r.w / 2, r.y + r.h]; },
      b: () => { const n = nodes.get(to); return [n.x, n.y + 22]; } });
  }
  for (const [from, to, label] of ARCH_EDGES) {
    wires.push({ cls: "arch", label,
      a: () => { const n = nodes.get(from); return [n.x + n.el.offsetWidth, n.y + 40]; },
      b: () => { const n = nodes.get(to); return [n.x, n.y + 40]; } });
  }
}

/** Stack each screen's rationale cards in a column to its right. */
function layoutCards() {
  const cols = {};
  for (const [id, n] of nodes) {
    if (!n.sid) continue;
    const s = nodes.get(n.sid);
    const col = (cols[n.sid] ??= { x: s.x + s.el.offsetWidth + 70, y: s.y, x2: s.x + s.el.offsetWidth + 70 + 350, y2: s.y, n: 0 });
    const twoCols = WHY.filter((w) => w[0] === n.sid).length > 5;
    const useSecond = twoCols && col.n % 2 === 1;
    n.x = useSecond ? col.x2 : col.x;
    n.y = useSecond ? col.y2 : col.y;
    if (useSecond) col.y2 += n.el.offsetHeight + 18; else col.y += n.el.offsetHeight + 18;
    col.n++;
    place(n);
  }
}

function drawWires() {
  let out = "";
  for (const w of wires) {
    const [x1, y1] = w.a();
    const [x2, y2] = w.b();
    const dx = Math.max(70, Math.abs(x2 - x1) * 0.45);
    const d = w.cls === "nav"
      ? `M${x1},${y1} C${x1},${y1 + 160} ${x2 - dx},${y2} ${x2},${y2}`
      : `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    const stroke = w.color ? ` stroke="${w.color}"` : "";
    out += `<path class="${w.cls}${w.hl ? " hl" : ""}" d="${d}"${stroke}/>`;
    if (w.cls !== "why") out += `<circle cx="${x2}" cy="${y2}" r="6" fill="${w.cls === "nav" ? "#4b67b4" : "#7d8699"}" class="${w.cls}"/>`;
    if (w.label) {
      const mx = 0.125 * x1 + 0.375 * (w.cls === "nav" ? x1 : x1 + dx) + 0.375 * (x2 - dx) + 0.125 * x2;
      const my = 0.125 * y1 + 0.375 * (w.cls === "nav" ? y1 + 160 : y1) + 0.375 * y2 + 0.125 * y2;
      out += `<text class="${w.cls}" x="${mx}" y="${my - 8}" text-anchor="middle">${w.label}</text>`;
    }
  }
  svg.innerHTML = out;
}

function highlight(id, on) {
  const n = nodes.get(id);
  n.anchor.classList.toggle("hl", on);
  for (const w of wires) if (w.card === id) w.hl = on;
  drawWires();
}

/* ---------- interaction ---------- */
let drag = null;
vp.addEventListener("pointerdown", (e) => {
  const head = e.target.closest(".nh");
  if (head) {
    const n = nodes.get(head.parentElement.dataset.id);
    // dragging a screen also drags its cards
    const group = n.screen ? [...nodes.values()].filter((m) => m === n || m.sid === head.parentElement.dataset.id) : [n];
    drag = { kind: "node", group, sx: e.clientX, sy: e.clientY, start: group.map((m) => [m.x, m.y]) };
    document.querySelectorAll(".node.sel").forEach((x) => x.classList.remove("sel"));
    n.el.classList.add("sel");
  } else if (!e.target.closest(".node") || e.button === 1) {
    drag = { kind: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    vp.classList.add("panning");
  } else return;
  vp.setPointerCapture(e.pointerId);
});
let raf = 0;
vp.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (drag.kind === "pan") {
    view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; applyView();
  } else {
    const dx = (e.clientX - drag.sx) / view.s, dy = (e.clientY - drag.sy) / view.s;
    drag.group.forEach((m, i) => { m.x = drag.start[i][0] + dx; m.y = drag.start[i][1] + dy; place(m); });
    cancelAnimationFrame(raf); raf = requestAnimationFrame(drawWires);
  }
});
vp.addEventListener("pointerup", () => { drag = null; vp.classList.remove("panning"); });

function zoomAt(cx, cy, factor) {
  const s = Math.min(2.5, Math.max(0.08, view.s * factor));
  view.x = cx - ((cx - view.x) * s) / view.s;
  view.y = cy - ((cy - view.y) * s) / view.s;
  view.s = s; applyView();
}
vp.addEventListener("wheel", (e) => {
  e.preventDefault();
  const mouseWheel = e.deltaMode === 1 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
  if (e.ctrlKey || e.metaKey || mouseWheel) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
  else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
}, { passive: false });

function bbox(list) {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const n of list) { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.el.offsetWidth); y2 = Math.max(y2, n.y + n.el.offsetHeight); }
  return { x1, y1, x2, y2 };
}
function fitTo(list, pad = 60) {
  const b = bbox(list);
  const vw = innerWidth, vh = innerHeight - 90;
  view.s = Math.min(2, (vw - pad * 2) / (b.x2 - b.x1), (vh - pad * 2) / (b.y2 - b.y1));
  view.x = (vw - (b.x2 - b.x1) * view.s) / 2 - b.x1 * view.s;
  view.y = 20 + (vh - (b.y2 - b.y1) * view.s) / 2 - b.y1 * view.s;
  applyView();
}
function focusGroup(g) {
  const list = [...nodes.values()].filter((n) => n.group === g || (g === "g-arch" && n.group === "g-arch"));
  fitTo(list, 40);
}

const thumbModes = ["off", "r", "l"], thumbLabel = { off: "拇指热区：关", r: "拇指热区：右手", l: "拇指热区：左手" };
let thumbI = 0;
function cycleThumb() {
  thumbI = (thumbI + 1) % 3;
  const m = thumbModes[thumbI];
  document.body.classList.remove("thumb-off", "thumb-r", "thumb-l");
  document.body.classList.add(`thumb-${m}`);
  const btn = document.querySelector("[data-thumb]");
  btn.textContent = thumbLabel[m]; btn.classList.toggle("on", m !== "off");
}
const wireModes = [["all", "连线：全部", ""], ["why", "连线：只看依据", "only-why"], ["nav", "连线：只看跳转", "only-nav"]];
let wireI = 0;
document.getElementById("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "fit") fitTo([...nodes.values()]);
  if (b.dataset.go) focusGroup(b.dataset.go);
  if (b.dataset.thumb) cycleThumb();
  if (b.dataset.wires) {
    wireI = (wireI + 1) % 3;
    document.body.classList.remove("only-why", "only-nav");
    if (wireModes[wireI][2]) document.body.classList.add(wireModes[wireI][2]);
    b.textContent = wireModes[wireI][1]; b.classList.toggle("on", wireI !== 0);
  }
});
addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") cycleThumb();
  if (e.key === "f" || e.key === "F") fitTo([...nodes.values()]);
});

/* ---------- boot ---------- */
build();
applyView();
const ready = document.fonts ? document.fonts.ready : Promise.resolve();
ready.then(() => {
  layoutCards();
  drawWires();
  const h = location.hash.slice(1);
  const [go, thumb] = h.split(",");
  if (thumb === "r") cycleThumb();
  if (thumb === "l") { cycleThumb(); cycleThumb(); }
  if (go && go !== "all") focusGroup(go); else fitTo([...nodes.values()]);
});
</script>
</body>
</html>
